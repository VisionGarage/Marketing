<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1b3030"/>

  <!--
    Symbol: 4 diagonal arms (NE/SE/SW/NW), each arm = outer-V + inner-V + side-bars + connector.
    All arms are identical; each rotated 45°, 135°, 225°, 315° around centre (256,175).
  -->
  <defs>
    <g id="arm" fill="#c9a84c">
      <!-- Outer V (tip at top, opens downward) -->
      <polygon points="-3,-68 -11,-52 -17,-52 -9,-68 0,-73 9,-68 17,-52 11,-52 3,-68"/>
      <!-- Side bars connecting outer V feet to inner V feet -->
      <rect x="-19" y="-52" width="5" height="19" rx="1"/>
      <rect x="14"  y="-52" width="5" height="19" rx="1"/>
      <!-- Inner V (tip at top, smaller) -->
      <polygon points="-2,-45 -8,-33 -13,-33 -5,-45 0,-50 5,-45 13,-33 8,-33 2,-45"/>
      <!-- Short connector bar to centre diamond -->
      <rect x="-5" y="-32" width="10" height="20" rx="2"/>
    </g>
  </defs>

  <g transform="translate(256,175)">
    <!-- 4 identical arms at the 4 diagonal corners -->
    <use href="#arm" transform="rotate(45)"/>
    <use href="#arm" transform="rotate(135)"/>
    <use href="#arm" transform="rotate(225)"/>
    <use href="#arm" transform="rotate(315)"/>

    <!-- Centre diamond -->
    <rect x="-20" y="-20" width="40" height="40" rx="2"
          transform="rotate(45)" fill="#c9a84c"/>
    <!-- 4 dots (cut-outs) -->
    <circle cx="-7" cy="-7" r="5"  fill="#1b3030"/>
    <circle cx="7"  cy="-7" r="5"  fill="#1b3030"/>
    <circle cx="-7" cy="7"  r="5"  fill="#1b3030"/>
    <circle cx="7"  cy="7"  r="5"  fill="#1b3030"/>
  </g>

  <!-- Brand name -->
  <text x="256" y="355"
        font-family="Georgia,'Times New Roman',serif"
        font-weight="700" font-size="95"
        fill="#ffffff" text-anchor="middle" letter-spacing="-2">VISION</text>
  <text x="256" y="422"
        font-family="Arial,Helvetica,sans-serif"
        font-size="44" font-weight="400"
        fill="#c9a84c" text-anchor="middle" letter-spacing="13">GARAGE</text>
</svg>
