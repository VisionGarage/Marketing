<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#1b3030"/>

  <!-- Geometric symbol centred at 256,175 -->
  <!-- 4 identical stepped L-bracket arms, each rotated 90° -->
  <g transform="translate(256,175)" fill="#c9a84c">
    <polygon points="30,-30 30,-75 52,-75 52,-97 82,-97 82,-75 97,-75 97,-45 75,-45 75,-30"/>
    <polygon points="30,-30 30,-75 52,-75 52,-97 82,-97 82,-75 97,-75 97,-45 75,-45 75,-30" transform="rotate(90)"/>
    <polygon points="30,-30 30,-75 52,-75 52,-97 82,-97 82,-75 97,-75 97,-45 75,-45 75,-30" transform="rotate(180)"/>
    <polygon points="30,-30 30,-75 52,-75 52,-97 82,-97 82,-75 97,-75 97,-45 75,-45 75,-30" transform="rotate(270)"/>
    <!-- Central diamond -->
    <rect x="-21" y="-21" width="42" height="42" rx="3" transform="rotate(45)"/>
    <!-- Dots -->
    <circle cx="-8" cy="-8" r="5.5" fill="#1b3030"/>
    <circle cx="8"  cy="-8" r="5.5" fill="#1b3030"/>
    <circle cx="-8" cy="8"  r="5.5" fill="#1b3030"/>
    <circle cx="8"  cy="8"  r="5.5" fill="#1b3030"/>
  </g>

  <!-- Brand name -->
  <text x="256" y="358"
    font-family="Georgia,'Times New Roman',serif"
    font-weight="700" font-size="95"
    fill="#ffffff" text-anchor="middle" letter-spacing="-2">VISION</text>
  <text x="256" y="422"
    font-family="Arial,Helvetica,sans-serif"
    font-size="44" font-weight="400"
    fill="#c9a84c" text-anchor="middle" letter-spacing="13">GARAGE</text>
</svg>
